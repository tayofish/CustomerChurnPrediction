
name: ChurnGuard - Automated Churn Prediction

on:
  push:
    branches:
      - main
    paths:
      - 'data_to_predict/**/*.csv'
      - 'data_to_predict/**/*.xlsx'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: churnguard-prediction
  cancel-in-progress: false

jobs:
  score:
    name: Automated Churn Prediction
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Checkout repository with full Git history
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Install Python and enable pip caching
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      # Install prediction dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Verify required files exist
      - name: Verify ChurnGuard model
        run: |
          test -f models/churnguard_xgboost.joblib
          test -f models/feature_schema.json
          test -f scripts/predict_changed.py
          echo "Model and scoring script verified."

      # Predict changed files on push
      # Predict all files when manually triggered
      - name: Run automated churn predictions
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python scripts/predict_changed.py --all
          else
            python scripts/predict_changed.py
          fi

      # Upload prediction results for download
      - name: Upload prediction results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: churnguard-predictions-${{ github.run_id }}
          path: outputs/automation/
          if-no-files-found: ignore
          retention-days: 30
